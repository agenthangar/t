name: Scheduled health
on:
  workflow_run:
    workflows: [Releases, Scorecard]
    types: [completed]
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: Send a clearly labeled Discord alert delivery test
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: scheduled-health
  cancel-in-progress: false
jobs:
  notify:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Never check out the triggering run's branch or execute its artifacts.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: .ci-alert-state.json
          key: scheduled-health-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: scheduled-health-v1-
      - name: Announce releases and report unhealthy scheduled runs
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALERT_WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK_URL }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          args=()
          if [ "$TEST_NOTIFICATION" = true ]; then args+=(--test); fi
          python3 scripts/scheduled_health.py "${args[@]}"
      # Preserve earlier acknowledged deliveries even if a later send fails.
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.ci-alert-state.json') != ''
        with:
          path: .ci-alert-state.json
          key: scheduled-health-v1-${{ github.run_id }}-${{ github.run_attempt }}
