name: CI
on:
  workflow_dispatch:
    inputs:
      run_macos:
        description: Include macOS and native desktop tests
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  # Keep only the newest CI run for each PR or pushed branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Public CLI noun/verb contract
        run: python3 scripts/lint_cli.py
      - name: Long-running command progress contract
        run: python3 scripts/lint_progress.py
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Shell syntax and lint
        run: |
          files=(install.sh)
          for f in bin/* .githooks/* ui/*.sh scripts/playground/* scripts/agentcore-test-runtime/*.sh; do
            head -1 "$f" | grep -qE '^#!.*\b(bash|sh)$' && files+=("$f")
          done
          shellcheck "${files[@]}"
          for f in t.plugin.zsh zsh/*.zsh; do zsh -n "$f"; done
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.run_macos && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        fzf: ['0.44.1', '0.74.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Runtime test dependencies
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zsh tmux lsof
          else
            command -v tmux >/dev/null || brew install tmux
          fi
          python -m pip install -r requirements-dev.txt
      - name: Pinned fzf ${{ matrix.fzf }}
        shell: bash
        run: |
          set -euo pipefail
          version=${{ matrix.fzf }}
          case "$(uname -s)" in
            Darwin) platform=darwin ;;
            Linux) platform=linux ;;
          esac
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
          esac
          extension=tar.gz
          if [ "$platform" = darwin ] && [ "$version" = 0.44.1 ]; then extension=zip; fi
          asset="fzf-${version}-${platform}_${arch}.${extension}"
          tag="$version"
          if [ "$version" = 0.74.5 ]; then tag="v$version"; fi
          url="https://github.com/junegunn/fzf/releases/download/${tag}"
          curl -fsSL --retry 3 "$url/$asset" -o "$RUNNER_TEMP/$asset"
          curl -fsSL --retry 3 "$url/fzf_${version}_checksums.txt" -o "$RUNNER_TEMP/fzf-checksums.txt"
          expected=$(awk -v asset="$asset" '$2 == asset {print $1}' "$RUNNER_TEMP/fzf-checksums.txt")
          test -n "$expected"
          actual=$(shasum -a 256 "$RUNNER_TEMP/$asset" | awk '{print $1}')
          test "$actual" = "$expected"
          mkdir -p "$RUNNER_TEMP/fzf-bin"
          if [ "$extension" = zip ]; then
            unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/fzf-bin"
          else
            tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/fzf-bin"
          fi
          echo "$RUNNER_TEMP/fzf-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fzf-bin/fzf" --version
      - name: Required real terminal picker tests
        run: |
          command -v fzf
          command -v tmux
          python -m pytest -q tests/test_picker_ui.py
      - name: AgentCore AWS CLI contract (local server, synthetic credentials)
        if: runner.os == 'Linux'
        env:
          T_REQUIRE_AWS_CONTRACT: '1'
        run: python -m pytest -q tests/test_agentcore.py -k real_aws_cli
      # Native windows run only on explicitly requested disposable macOS runners.
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=97 ${{ runner.os == 'macOS' && '--run-macos-ui' || '' }}
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fresh install and terminal session flow
        run: python3 scripts/playground.py smoke
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --redact
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit && pip-audit -r requirements-dev.txt
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
  ci:
    name: CI
    if: always()
    needs: [cli-contract, shell, pytest, playground, gitleaks, pip-audit, codeql]
    runs-on: ubuntu-latest
    steps:
      - run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            [ "$result" = success ] || { echo "Required job: $result"; exit 1; }
          done
