name: CI
on:
  workflow_dispatch:
    inputs:
      run_macos:
        description: Include macOS and native desktop tests
        type: boolean
        default: false
      verify_shards:
        description: Compare Linux shards with a same-commit full reference run
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  # Keep only the newest CI run for each PR or pushed branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Public CLI noun/verb contract
        run: python3 scripts/lint_cli.py
      - name: Long-running command progress contract
        run: python3 scripts/lint_progress.py
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Shell syntax and lint
        run: |
          files=(install.sh)
          for f in bin/* .githooks/* ui/*.sh scripts/playground/* scripts/agentcore-test-runtime/*.sh; do
            head -1 "$f" | grep -qE '^#!.*\b(bash|sh)$' && files+=("$f")
          done
          shellcheck "${files[@]}"
          for f in t.plugin.zsh zsh/*.zsh; do zsh -n "$f"; done
  pytest:
    name: Linux shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    env:
      T_REQUIRE_AWS_CONTRACT: '1'
      COVERAGE_FILE: artifacts/.coverage.${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-runtime
        with:
          fzf: '0.74.5'
      - name: Complete collection and serial whole-file shard
        run: |
          mkdir -p artifacts
          python -m pytest -p scripts.ci_shards \
            --ci-shard=${{ matrix.shard }} --ci-shards=4 \
            --ci-manifest=artifacts/manifest.json \
            --durations=30 --junitxml=artifacts/junit.xml \
            --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  fzf-legacy:
    name: Legacy fzf compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-runtime
        with:
          fzf: '0.44.1'
      - name: Complete real fzf compatibility files
        run: >-
          python -m pytest -p scripts.ci_shards --ci-legacy
          --ci-manifest=artifacts/manifest.json
          --durations=30 --junitxml=artifacts/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fzf-legacy
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  coverage:
    name: Combined Linux coverage
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Exact-once outcomes and combined 97 percent coverage
        run: python scripts/ci_shards.py combine shards
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined
          path: combined/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  reference:
    name: Unsharded Linux reference
    if: github.event_name == 'workflow_dispatch' && inputs.verify_shards
    runs-on: ubuntu-latest
    env:
      T_REQUIRE_AWS_CONTRACT: '1'
      COVERAGE_FILE: artifacts/.coverage.reference
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-runtime
        with:
          fzf: '0.74.5'
      - run: |
          mkdir -p artifacts
          python -m pytest -p scripts.ci_shards \
            --ci-manifest=artifacts/manifest.json \
            --durations=30 --junitxml=artifacts/junit.xml \
            --cov --cov-report= --cov-fail-under=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference
          path: artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify-shards:
    name: Verify shard equivalence
    if: github.event_name == 'workflow_dispatch' && inputs.verify_shards
    needs: [coverage, reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: combined
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: reference
          path: reference
      - run: python scripts/ci_shards.py compare combined/audit.json reference
  macos:
    name: macOS fzf ${{ matrix.fzf }}
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos
    strategy:
      fail-fast: false
      matrix:
        fzf: ['0.44.1', '0.74.5']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test-runtime
        with:
          fzf: ${{ matrix.fzf }}
      # Native windows only on explicitly requested disposable macOS runners.
      - run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=97 --run-macos-ui --durations=30 --junitxml=artifacts/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.fzf }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  playground:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Fresh install and terminal session flow
        run: python3 scripts/playground.py smoke
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/repo --redact
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit && pip-audit -r requirements-dev.txt
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
  ci:
    name: CI
    if: always()
    needs: [cli-contract, shell, pytest, fzf-legacy, coverage, reference, verify-shards, macos, playground, gitleaks, pip-audit, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Required jobs and explicitly optional modes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECT_MACOS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_macos }}
          EXPECT_REFERENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_shards }}
        run: |
          python - <<'PY'
          import json, os
          optional = set()
          if os.environ['EXPECT_MACOS'] != 'true':
              optional.add('macos')
          if os.environ['EXPECT_REFERENCE'] != 'true':
              optional.update(('reference', 'verify-shards'))
          for name, job in json.loads(os.environ['NEEDS_JSON']).items():
              expected = 'skipped' if name in optional else 'success'
              if job['result'] != expected:
                  raise SystemExit(f"{name}: {job['result']} (expected {expected})")
          PY
