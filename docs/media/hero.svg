<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">t — coding agent sessions, ready when you are</title>
  <desc id="desc">A terminal card shows commands to open, list, resume, and move a coding-agent session. Warm amber paths connect three isolated task cards.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#292b2d" stroke-width="1"/></pattern>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f2a93b" stop-opacity=".2"/><stop offset="1" stop-color="#f2a93b" stop-opacity="0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="680" fill="#141516"/>
  <rect width="1200" height="680" fill="url(#grid)" opacity=".65"/>
  <circle cx="995" cy="112" r="360" fill="url(#glow)"/>
  <path d="M0 592H1200" stroke="#303235"/>
  <g font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif">
    <text x="62" y="75" fill="#f2a93b" font-family="IBM Plex Mono, Menlo, monospace" font-size="18" letter-spacing="4">AGENTHANGAR  /  BAY 04</text>
    <rect x="62" y="117" width="90" height="90" rx="19" fill="#f2a93b"/>
    <text x="106" y="185" text-anchor="middle" fill="#141516" font-size="76" font-weight="700">t</text>
    <text x="174" y="177" fill="#f6f3ec" font-size="58" font-weight="700" letter-spacing="-2">One command.</text>
    <text x="62" y="275" fill="#f6f3ec" font-size="62" font-weight="700" letter-spacing="-2">Every agent session.</text>
    <text x="64" y="320" fill="#b8b3a8" font-size="23">Open a task in its own worktree. Find it, resume it, move it.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="62" y="366" width="704" height="246" rx="14" fill="#1c1d1f" stroke="#3a3c3e"/>
    <rect x="62" y="366" width="704" height="42" rx="14" fill="#25272a"/>
    <path d="M62 394H766" stroke="#3a3c3e"/>
    <circle cx="87" cy="387" r="5" fill="#f2a93b"/><circle cx="105" cy="387" r="5" fill="#7d786f"/><circle cx="123" cy="387" r="5" fill="#7d786f"/>
    <text x="383" y="392" text-anchor="middle" fill="#8c8983" font-family="IBM Plex Mono, Menlo, monospace" font-size="13">terminal  ·  ~/code/project</text>
    <g font-family="IBM Plex Mono, Menlo, monospace" font-size="20">
      <text x="90" y="453" fill="#f2a93b">$</text><text x="115" y="453" fill="#f6f3ec">t open project --new</text>
      <text x="90" y="496" fill="#f2a93b">$</text><text x="115" y="496" fill="#f6f3ec">t ls</text>
      <text x="90" y="539" fill="#f2a93b">$</text><text x="115" y="539" fill="#f6f3ec">t resume project 1</text>
      <text x="90" y="582" fill="#f2a93b">$</text><text x="115" y="582" fill="#f6f3ec">t beam project --host build</text>
    </g>
  </g>
  <g font-family="IBM Plex Mono, Menlo, monospace" font-size="14">
    <path d="M820 436C852 436 849 427 879 427" stroke="#f2a93b" stroke-width="2" fill="none"/>
    <path d="M820 478C852 478 849 508 879 508" stroke="#f2a93b" stroke-width="2" fill="none"/>
    <path d="M820 521C852 521 849 589 879 589" stroke="#f2a93b" stroke-width="2" fill="none"/>
    <g fill="#1c1d1f" stroke="#47433b"><rect x="879" y="400" width="257" height="54" rx="8"/><rect x="879" y="481" width="257" height="54" rx="8"/><rect x="879" y="562" width="257" height="54" rx="8"/></g>
    <text x="899" y="433" fill="#ebe7df">01  isolated worktree</text>
    <text x="899" y="514" fill="#ebe7df">02  tmux session</text>
    <text x="899" y="595" fill="#ebe7df">03  same conversation</text>
  </g>
  <text x="62" y="649" fill="#7d786f" font-family="IBM Plex Mono, Menlo, monospace" font-size="15">github.com/agenthangar/t</text>
</svg>
